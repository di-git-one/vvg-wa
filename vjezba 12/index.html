<form>
    <label>First Name *</label><br>
    <input type="text" placeholder="Your first name..." required><br><br>

    <label>Last Name *</label><br>
    <input type="text" placeholder="Your last name..." required><br><br>

    <label>Your E-mail *</label><br>
    <input type="email" placeholder="Your e-mail..." required><br><br>

    <label for="country">Country</label>
<select id="country" name="country">
    <option value="">Please select</option>
    <option value="BE">Belgium</option>
    <option value="HR" selected>Croatia</option>
    <option value="LU">Luxembourg</option>
    <option value="HU">Hungary</option>
</select>

    <label>Message</label><br>
    <textarea rows="3" cols="25" placeholder="Write something..."></textarea><br><br>

    <input type="submit" value="Send">
    <input type="reset" value="Reset">
</form>
