
<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <title>Vježba 3_1 - Video elementi</title>
</head>

<body>

    <h1>Video elementi</h1>

    <h2>1. HTML5 video element</h2>

    <video width="560" height="315" controls>
        <source src="videos/test-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>2. YouTube video - iframe</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/3twTXtuICdE?	si=weJrjpPtrldWj8Qj" title="YouTube video player" frameborder="0" 	allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; 	picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-	origin" allowfullscreen>
   </iframe>

   <!--jednostavnije--> 

  <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/3twTXtuICdE"
    title="YouTube video player"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen>
</iframe>


</body>
</html>
